name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and validate without publishing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      can_publish: ${{ steps.targets.outputs.can_publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Read the version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Publishing and deploying are optional. Report whether each is set up so
      # the dependent jobs can skip rather than fail — a tag should not show a
      # permanent red cross because a target nobody configured is unreachable.
      - name: Which release targets are configured
        id: targets
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "can_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping the npm publish: no NPM_TOKEN secret." \
              "Add an npm automation token under Settings -> Secrets and variables" \
              "-> Actions to publish automatically, or publish by hand with" \
              "pnpm publish -r --access public --filter '!@unmarkk/web'."
          fi

      # Tagging v1.0.1 and shipping 1.0.0 is the classic release mistake, and
      # npm versions cannot be replaced. Catch it before anything is published.
      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="${{ steps.version.outputs.version }}"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - run: pnpm run format:check
      - run: pnpm run lint
      # Build before typechecking: consumers resolve @unmarkk/core through its
      # declaration files, which do not exist until it has been built.
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm test

      # The privacy claim is structural, so it gates the release too.
      - name: Engine still has no dependencies or I/O
        run: |
          deps=$(node -p "Object.keys(require('./packages/core/package.json').dependencies ?? {}).length")
          [ "$deps" = "0" ] || { echo "::error::@unmarkk/core gained runtime dependencies"; exit 1; }
          ! grep -rqE "from '(node:|fs|path|http|https|net|child_process)" packages/core/src \
            || { echo "::error::@unmarkk/core imports a Node built-in"; exit 1; }
          ! grep -rqE "\b(fetch|XMLHttpRequest|WebSocket|sendBeacon)\s*\(" packages/core/src \
            || { echo "::error::@unmarkk/core contains a network call"; exit 1; }

      - name: Inspect the tarballs
        run: |
          for p in core cli server; do
            echo "--- @unmarkk/$p ---"
            (cd "packages/$p" && npm pack --dry-run)
          done

  publish:
    name: publish to npm
    needs: verify
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/')
      && inputs.dry_run != true
      && needs.verify.outputs.can_publish == 'true'
    environment: release
    permissions:
      contents: read
      # Required for npm provenance: it signs the published tarball against
      # this workflow run, so anyone can verify what commit produced it with
      # `npm audit signatures`.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Order matters: cli and server depend on core, so core must be on the
      # registry first. pnpm resolves that itself with a recursive publish, and
      # rewrites the workspace:* ranges to real versions on the way out.
      - name: Publish
        run: pnpm publish -r --access public --no-git-checks --filter '!@unmarkk/web'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

  pages:
    name: deploy the web app
    needs: verify
    runs-on: ubuntu-latest
    # Opt in by setting the repository variable DEPLOY_PAGES to "true" once
    # Settings -> Pages -> Source is set to GitHub Actions. Whether Pages is
    # enabled cannot be detected from inside a workflow, and a job that always
    # runs would fail every release until somebody ticked that box.
    if: startsWith(github.ref, 'refs/tags/') && vars.DEPLOY_PAGES == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @unmarkk/core build
      - run: pnpm --filter @unmarkk/web build

      # `enablement` switches Pages on when the repository has never had it
      # configured. Without it the action fails with a bare "Not Found", which
      # is an unhelpful way to say "tick a box in Settings".
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/web/dist

      - id: deploy
        uses: actions/deploy-pages@v4
